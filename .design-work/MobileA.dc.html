<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&display=swap');
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #D69F4C; } a:hover { color: #E8B35A; }
    .display { font-family: 'Anton', Impact, 'Arial Narrow', sans-serif; font-weight: 400; letter-spacing: 0.5px; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: rgba(255,255,255,0.42); }
    .tile { background: linear-gradient(180deg, #16207e 0%, #0E1467 100%); border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 6px 18px rgba(0,0,0,0.3); box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: radial-gradient(500px 380px at 50% 4%, #17237d 0%, rgba(23,35,125,0) 64%), linear-gradient(165deg, #020820 0%, #08103f 50%, #0b1352 100%); padding: 18px 18px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">

  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; flex-shrink: 0;">
    <span class="display" style="font-size: 25px; color: #D69F4C; text-shadow: 0 2px 0 #7a5520;">JEOPARODY!</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 40px; height: 40px; border-radius: 999px; background: #0a0f4a; border: 1px solid rgba(214,159,76,0.4); display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="15" viewBox="0 0 26 16" fill="none"><path d="M2 12c3-9 5 3 7-4s4 8 6 1 3 3 5-2" stroke="#D69F4C" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="rgba(255,255,255,0.6)" stroke-width="1.6"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" stroke="rgba(255,255,255,0.6)" stroke-width="1.4"/></svg>
      </div>
    </div>
  </div>

  <!-- Join first: on a phone, you are almost always the guest -->
  <div class="tile" style="padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 12px; border-color: rgba(255,255,255,0.17); flex-shrink: 0;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span class="display" style="font-size: 19px; color: #fff;">JOIN A GAME</span>
      <span style="font-size: 11.5px; color: rgba(255,255,255,0.42);">Code from the host</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <div style="flex: 1; height: 54px; border-radius: 9px; background: rgba(0,0,0,0.34); border: 1.5px solid rgba(214,159,76,0.55); display: flex; align-items: center; justify-content: center;"><span class="display" style="font-size: 25px; color: #D69F4C;">K</span></div>
      <div style="flex: 1; height: 54px; border-radius: 9px; background: rgba(0,0,0,0.34); border: 1.5px solid rgba(214,159,76,0.55); display: flex; align-items: center; justify-content: center;"><span class="display" style="font-size: 25px; color: #D69F4C;">7</span></div>
      <div style="flex: 1; height: 54px; border-radius: 9px; background: rgba(0,0,0,0.34); border: 1.5px solid rgba(255,255,255,0.35);"></div>
      <div style="flex: 1; height: 54px; border-radius: 9px; background: rgba(0,0,0,0.34); border: 1.5px solid rgba(255,255,255,0.16);"></div>
      <div style="flex: 1; height: 54px; border-radius: 9px; background: rgba(0,0,0,0.34); border: 1.5px solid rgba(255,255,255,0.16);"></div>
      <div style="flex: 1; height: 54px; border-radius: 9px; background: rgba(0,0,0,0.34); border: 1.5px solid rgba(255,255,255,0.16);"></div>
    </div>
  </div>

  <!-- Daily anchor -->
  <div class="tile" style="padding: 20px; display: flex; flex-direction: column; gap: 16px; border-color: rgba(214,159,76,0.3); background: linear-gradient(155deg, #1b2a92 0%, #0E1467 60%, #0a0f4a 100%); position: relative; overflow: hidden; flex-shrink: 0;">
    <div style="position: absolute; right: -50px; top: -50px; width: 190px; height: 190px; border-radius: 999px; background: radial-gradient(circle, rgba(214,159,76,0.2) 0%, rgba(214,159,76,0) 70%);"></div>
    <div style="display: flex; flex-direction: column; gap: 8px; position: relative;">
      <span class="eyebrow" style="color: #D69F4C;">Today · Aug 29</span>
      <span class="display" style="font-size: 34px; line-height: 0.94; color: #fff;">DAILY<br>CHALLENGE</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; position: relative;">
      <div style="display: flex; align-items: center; gap: 18px;">
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <span class="display" style="font-size: 26px; color: #D69F4C; line-height: 1;">4</span>
          <span class="eyebrow">Streak</span>
        </div>
        <div style="width: 1px; height: 32px; background: rgba(255,255,255,0.12);"></div>
        <div style="display: flex; flex-direction: column; gap: 1px;">
          <span class="display" style="font-size: 26px; color: #fff; line-height: 1;">$4,800</span>
          <span class="eyebrow">Best</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 7px; background: linear-gradient(135deg, #E8B35A, #D69F4C); color: #14100a; height: 46px; padding: 0 20px; border-radius: 11px; font-size: 14px; font-weight: 700; box-shadow: 0 6px 18px rgba(214,159,76,0.3);">
        Play
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="#14100a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </div>

  <!-- Party modes -->
  <div class="tile" style="height: 72px; padding: 0 18px; display: flex; align-items: center; gap: 14px; flex-shrink: 0;">
    <div style="width: 40px; height: 40px; border-radius: 11px; background: rgba(126,184,255,0.13); border: 1px solid rgba(126,184,255,0.28); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="#7eb8ff" stroke-width="1.7"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="#7eb8ff" stroke-width="1.7" stroke-linecap="round"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6M17.5 14.4c2 .7 3.2 2.4 3.2 4.6" stroke="#7eb8ff" stroke-width="1.7" stroke-linecap="round"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1;">
      <span style="font-size: 15.5px; font-weight: 700; color: #fff;">Multiplayer</span>
      <span style="font-size: 11.5px; color: rgba(255,255,255,0.44);">Private room · up to 6</span>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="rgba(255,255,255,0.32)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="tile" style="height: 72px; padding: 0 18px; display: flex; align-items: center; gap: 14px; flex-shrink: 0;">
    <div style="width: 40px; height: 40px; border-radius: 11px; background: rgba(214,159,76,0.13); border: 1px solid rgba(214,159,76,0.28); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="9" y="2.5" width="6" height="11" rx="3" stroke="#D69F4C" stroke-width="1.7"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" stroke="#D69F4C" stroke-width="1.7" stroke-linecap="round"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; flex: 1;">
      <span style="font-size: 15.5px; font-weight: 700; color: #fff;">Host a Game</span>
      <span style="font-size: 11.5px; color: rgba(255,255,255,0.44);">You read · up to 30</span>
    </div>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="rgba(255,255,255,0.32)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <!-- Solo pair -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex-shrink: 0;">
    <div class="tile" style="height: 96px; padding: 15px 16px; display: flex; flex-direction: column; justify-content: space-between;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="rgba(255,255,255,0.75)" stroke-width="1.7"/><path d="M5 20c0-3.6 3.1-6.2 7-6.2s7 2.6 7 6.2" stroke="rgba(255,255,255,0.75)" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="display" style="font-size: 17px; color: #fff;">SINGLE<br>PLAYER</span>
    </div>
    <div class="tile" style="height: 96px; padding: 15px 16px; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="display: flex; align-items: flex-start; justify-content: space-between;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12l1-7.5z" stroke="#7eb8ff" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <div style="display: flex; align-items: center; gap: 5px;">
          <span style="width: 5px; height: 5px; border-radius: 999px; background: #4ade80;"></span>
          <span style="font-size: 10.5px; font-weight: 600; color: #4ade80;">12</span>
        </div>
      </div>
      <span class="display" style="font-size: 17px; color: #fff;">QUICK<br>PLAY</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
