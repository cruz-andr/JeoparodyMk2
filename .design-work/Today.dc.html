<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap');
    body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; }
    a { color: #D69F4C; } a:hover { color: #E8B35A; }
  </style>
</helmet>

<div style="width: 1440px; height: 900px; background: linear-gradient(160deg, #020820 0%, #0a1250 40%, #0E1467 100%); display: flex; flex-direction: column; align-items: center; padding: 60px 24px 40px; gap: 32px; box-sizing: border-box; position: relative; overflow: hidden;">

  <!-- Logo (the real app ships a 480px-wide raster wordmark here) -->
  <div style="width: 480px; height: 200px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
    <div style="font-family: Impact, 'Arial Narrow', sans-serif; font-size: 76px; letter-spacing: 2px; color: #D69F4C; text-shadow: 0 4px 0 #7a5520, 0 0 30px rgba(214,159,76,0.25); transform: skewX(-6deg);">JEOPARODY!</div>
  </div>

  <!-- Daily Challenge card -->
  <div style="width: 520px; display: flex; justify-content: space-between; align-items: center; padding: 24px 28px; background: rgba(214,159,76,0.08); border: 1px solid rgba(214,159,76,0.2); border-radius: 16px; box-sizing: border-box; flex-shrink: 0;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 22px; height: 22px; background: #D69F4C; flex-shrink: 0; clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);"></div>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-family: Impact, 'Arial Narrow', sans-serif; font-size: 19px; letter-spacing: 0.5px; color: #D69F4C;">Daily Challenge</span>
        <span style="font-size: 13.6px; color: rgba(255,255,255,0.5);">New puzzle every day</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 12px; color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.06); padding: 4px 10px; border-radius: 20px;">4 day streak</span>
      <span style="font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; background: linear-gradient(135deg, #D69F4C, #c9a227); color: #1a1000;">Play Now</span>
    </div>
  </div>

  <!-- Mode grid: four cards of identical weight -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 520px; flex-shrink: 0;">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px;">
      <div style="width: 18px; height: 18px; background: #7eb8ff; clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);"></div>
      <span style="font-size: 16.8px; font-weight: 600; color: #ffffff; letter-spacing: 0.3px;">Single Player</span>
      <span style="font-size: 12.8px; color: rgba(255,255,255,0.4); line-height: 1.4;">Play solo against the board</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px;">
      <div style="width: 18px; height: 18px; background: #7eb8ff; clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);"></div>
      <span style="font-size: 16.8px; font-weight: 600; color: #ffffff; letter-spacing: 0.3px;">Multiplayer</span>
      <span style="font-size: 12.8px; color: rgba(255,255,255,0.4); line-height: 1.4;">Create a private room</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px;">
      <div style="width: 18px; height: 18px; background: #7eb8ff; clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);"></div>
      <span style="font-size: 16.8px; font-weight: 600; color: #ffffff; letter-spacing: 0.3px;">Quickplay</span>
      <span style="font-size: 12.8px; color: rgba(255,255,255,0.4); line-height: 1.4;">Match with random players</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 20px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px;">
      <div style="width: 18px; height: 18px; background: #7eb8ff; clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);"></div>
      <span style="font-size: 16.8px; font-weight: 600; color: #ffffff; letter-spacing: 0.3px;">Host a Game</span>
      <span style="font-size: 12.8px; color: rgba(255,255,255,0.4); line-height: 1.4;">Educator &amp; custom games</span>
    </div>
  </div>

  <!-- Join, as a low-contrast text link -->
  <div style="color: rgba(255,255,255,0.45); font-size: 15.2px; letter-spacing: 0.3px; padding: 8px 16px; flex-shrink: 0;">Join a Room</div>

  <!-- Footer -->
  <div style="margin-top: auto; display: flex; align-items: center; gap: 24px;">
    <span style="color: rgba(255,255,255,0.3); font-size: 12.8px; letter-spacing: 0.5px; text-transform: uppercase;">Highscores</span>
    <span style="color: rgba(255,255,255,0.3); font-size: 12.8px; letter-spacing: 0.5px; text-transform: uppercase;">Settings</span>
  </div>

</div>
</x-dc>
</body>
</html>
