<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;700;800;900&family=Petrona:ital,wght@0,400;0,600;1,400&display=swap');
    body { margin: 0; font-family: 'Petrona', Georgia, serif; }
    a { color: #D69F4C; } a:hover { color: #E8B35A; }
    .board { font-family: 'Big Shoulders Display', 'Haettenschweiler', 'Arial Narrow', sans-serif; text-transform: uppercase; }
    .tile {
      background: linear-gradient(177deg, #232ca8 0%, #141d84 42%, #0d1466 100%);
      display: flex; align-items: center; justify-content: center; position: relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(0,0,0,0.35);
    }
    .tile::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0) 46%);
    }
    .tile.done { background: #090e3a; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
    .tile.done::after { display: none; }
    .row { display: grid; grid-template-columns: repeat(5, 1fr); }
    .wheel { perspective: 620px; perspective-origin: 50% 50%; }
    .band.up   { transform: rotateX(20deg) scale(0.93); opacity: 0.72; }
    .band.down { transform: rotateX(-20deg) scale(0.93); opacity: 0.72; }
    /* Two rings out: visible so the wheel reads as a wheel, deliberately not
       playable. No values, no light, so nothing invites a tap. */
    .band.far  { transform: rotateX(46deg) scale(0.8); opacity: 0.2; filter: blur(1.4px); }
    .band.far.down2 { transform: rotateX(-46deg) scale(0.8); }
    .band.far .tile { background: #101a5e; box-shadow: none; }
    .band.far .tile::after { display: none; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: radial-gradient(120% 62% at 50% 16%, #16207a 0%, #070c2e 56%, #03050f 100%); position: relative; overflow: hidden;">

  <!-- label and close on one row, so they share a vertical centre -->
  <div style="position: absolute; top: 18px; left: 18px; right: 14px; height: 48px; display: flex; align-items: center; justify-content: space-between; z-index: 8;">
    <span class="board" style="font-size: 11px; font-weight: 800; letter-spacing: 1.8px; color: rgba(242,236,224,0.4);">FRI AUG 29 &middot; 11 OF 30</span>
    <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <span class="board" style="font-size: 36px; font-weight: 600; color: rgba(242,236,224,0.6); line-height: 1;">&times;</span>
    </span>
  </div>

  <div class="wheel" style="position: absolute; top: 66px; left: 0; right: 0; bottom: 116px; display: flex; flex-direction: column; justify-content: center; gap: 15px; padding: 0 18px;">

    <!-- two rings out: visible so the wheel reads as continuing, not playable -->
    <div class="band far">
      <div class="board" style="font-size: 13px; font-weight: 800; letter-spacing: 1.4px; color: rgba(242,236,224,0.8); margin-bottom: 4px;">Unscripted TV</div>
      <div class="row" style="gap: 4px;">
        <div class="tile done" style="height: 22px;"></div><div class="tile done" style="height: 22px;"></div>
        <div class="tile" style="height: 22px;"></div><div class="tile" style="height: 22px;"></div><div class="tile" style="height: 22px;"></div>
      </div>
    </div>

    <div class="band up">
      <div class="board" style="font-size: 21px; font-weight: 800; letter-spacing: 0.6px; color: rgba(242,236,224,0.9); margin-bottom: 7px;">Fruit, Not Fruit</div>
      <div class="row" style="gap: 6px;">
        <div class="tile done" style="height: 62px;"><span class="board" style="font-size:14px;font-weight:900;color:#2f7a49;">&#10003;</span></div>
        <div class="tile done" style="height: 62px;"><span class="board" style="font-size:14px;font-weight:900;color:#2f7a49;">&#10003;</span></div>
        <div class="tile done" style="height: 62px;"><span class="board" style="font-size:14px;font-weight:900;color:#8f3340;">&#10007;</span></div>
        <div class="tile" style="height: 62px;"><span class="board" style="font-size:16px;font-weight:900;color:#E8B35A;">$800</span></div>
        <div class="tile" style="height: 62px;"><span class="board" style="font-size:13px;font-weight:900;color:#E8B35A;">$1000</span></div>
      </div>
    </div>

    <div class="band">
      <div class="board" style="font-size: 32px; font-weight: 900; color: #FFFFFF; margin-bottom: 12px; text-shadow: 0 2px 18px rgba(120,150,255,0.4);">Innovations</div>
      <div class="row" style="gap: 7px;">
        <div class="tile done" style="height: 94px;"><span class="board" style="font-size:18px;font-weight:900;color:#2f7a49;">&#10003;</span></div>
        <div class="tile" style="height: 94px;"><span class="board" style="font-size:19px;font-weight:900;color:#E8B35A;">$400</span></div>
        <div class="tile" style="height: 94px;"><span class="board" style="font-size:19px;font-weight:900;color:#E8B35A;">$600</span></div>
        <div class="tile" style="height: 94px;"><span class="board" style="font-size:19px;font-weight:900;color:#E8B35A;">$800</span></div>
        <div class="tile" style="height: 94px;"><span class="board" style="font-size:16px;font-weight:900;color:#E8B35A;">$1000</span></div>
      </div>
    </div>

    <div class="band down">
      <div class="board" style="font-size: 21px; font-weight: 800; letter-spacing: 0.6px; color: rgba(242,236,224,0.9); margin-bottom: 7px;">French Dip</div>
      <div class="row" style="gap: 6px;">
        <div class="tile done" style="height: 62px;"><span class="board" style="font-size:14px;font-weight:900;color:#2f7a49;">&#10003;</span></div>
        <div class="tile done" style="height: 62px;"><span class="board" style="font-size:14px;font-weight:900;color:#8f3340;">&#10007;</span></div>
        <div class="tile" style="height: 62px;"><span class="board" style="font-size:16px;font-weight:900;color:#E8B35A;">$600</span></div>
        <div class="tile" style="height: 62px;"><span class="board" style="font-size:16px;font-weight:900;color:#E8B35A;">$800</span></div>
        <div class="tile" style="height: 62px;"><span class="board" style="font-size:13px;font-weight:900;color:#E8B35A;">$1000</span></div>
      </div>
    </div>

    <div class="band far down2">
      <div class="board" style="font-size: 13px; font-weight: 800; letter-spacing: 1.4px; color: rgba(242,236,224,0.8); margin-bottom: 4px;">Democrats</div>
      <div class="row" style="gap: 4px;">
        <div class="tile done" style="height: 22px;"></div><div class="tile" style="height: 22px;"></div>
        <div class="tile" style="height: 22px;"></div><div class="tile" style="height: 22px;"></div><div class="tile" style="height: 22px;"></div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 62px; height: 66px; background: linear-gradient(180deg, rgba(7,12,46,0.95) 0%, rgba(7,12,46,0) 100%); pointer-events: none;"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 116px; height: 76px; background: linear-gradient(180deg, rgba(3,5,15,0) 0%, rgba(3,5,15,0.92) 88%); pointer-events: none;"></div>

  <!-- Solo: one podium, the full width of the rail. No target to chase. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 12px 20px;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 2px 7px;">
      <span class="board" style="font-size: 10px; font-weight: 800; letter-spacing: 1.6px; color: rgba(242,236,224,0.4);">THE BOARD</span>
      <span class="board" style="font-size: 10px; font-weight: 800; letter-spacing: 1.6px; color: rgba(242,236,224,0.4);">4 DAY STREAK</span>
    </div>
    <div style="background: linear-gradient(180deg, #E8B35A 0%, #C98F3C 100%);
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 -3px 22px rgba(232,179,90,0.35);
                display: flex; align-items: center; justify-content: space-between; padding: 12px 24px;">
      <svg width="96" height="26" viewBox="0 0 66 22" fill="none"><path d="M3 16c6-14 9 5 13-5s6 12 9 1 5 5 8-3 5 8 8 2 6 3 9-3" stroke="#14100a" stroke-width="2.1" stroke-linecap="round"/></svg>
      <span class="board" style="font-size: 34px; font-weight: 900; line-height: 1; color: #14100a;">$3,400</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
