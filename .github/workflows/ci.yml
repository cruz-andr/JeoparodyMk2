# Nothing reaches main untested, and the two halves deploy together.
#
# One job proves the tree: lint, build, every plain node suite, then the
# browser suites against a real Chrome. On a push to main a second job deploys
# the server to Fly, and only after the first job is green.
#
# The frontend is not deployed from here. Vercel's own git integration builds
# it from the same push. Vercel's build is a few minutes of its own, and this
# server deploy is what it waits behind in practice: a frontend that lands on
# an older server would call an API the server does not have yet, so the order
# here is server first, and the frontend follows once its build finishes.
# If the test job is red the server never deploys, and the Vercel deployment
# should be set to require this check (Settings, Git, "Require checks to pass")
# so the frontend does not go out alone.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels the older run: nobody needs the
# result of a commit that is no longer the branch tip. A push to main is never
# cancelled, because this run may be mid deploy, and killing flyctl halfway
# through a rolling update leaves the Fly app half rolled until the next push
# gets a green test job of its own. The job level group on deploy-server only
# serialises deploys against each other; it cannot stop a cancel from here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      # better-sqlite3 and bcrypt are native. When no prebuilt binary matches
      # the runner's Node they compile, which is why this is not --ignore-scripts.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # scripts/test-all.mjs: every src/**/*.test.js, server/test/*.test.js
      # and scripts/*.test.js, each in its own process, non zero on any red.
      - name: Unit tests
        run: npm test

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # The browser suites start their own API on 3995 and Vite on 5000 with a
      # throwaway database, so nothing here needs a secret or a network.
      # e2e/driver.mjs reads CHROME for the binary; without it, it looks in
      # the usual places for the platform. e2e/run.mjs deletes e2e/shots/ on
      # the way out, failure or not, unless KEEP_SHOTS=1: without it the
      # upload step below would find nothing to keep.
      - name: Browser suites
        run: npm run e2e
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          KEEP_SHOTS: '1'

      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e/shots/
          if-no-files-found: ignore

  deploy-server:
    name: Deploy server to Fly
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time. Not being cancelled halfway is the workflow level
    # concurrency's job, above: this group only queues deploys behind each other.
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # FLY_API_TOKEN is a repository secret: a deploy token from
      # `fly tokens create deploy -x 999999h` in server/, added under
      # Settings, Secrets and variables, Actions.
      - name: Deploy
        run: flyctl deploy --remote-only
        working-directory: server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
