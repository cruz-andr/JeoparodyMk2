<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Jeoparody!">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1467"/>
      <stop offset="1" stop-color="#0B0D1F"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2080"/>
      <stop offset="1" stop-color="#0E1467"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0D1F" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B0D1F" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#ground)"/>
  <!-- the board: six columns, sinking into the ground -->
  <g fill="url(#tile)" stroke="#0B0D1F" stroke-width="6">
    <rect x="40" y="380" width="180" height="90"/><rect x="230" y="380" width="180" height="90"/><rect x="420" y="380" width="180" height="90"/><rect x="610" y="380" width="180" height="90"/><rect x="800" y="380" width="180" height="90"/><rect x="990" y="380" width="180" height="90"/>
    <rect x="40" y="476" width="180" height="90"/><rect x="230" y="476" width="180" height="90"/><rect x="420" y="476" width="180" height="90"/><rect x="610" y="476" width="180" height="90"/><rect x="800" y="476" width="180" height="90"/><rect x="990" y="476" width="180" height="90"/>
    <rect x="40" y="572" width="180" height="90"/><rect x="230" y="572" width="180" height="90"/><rect x="420" y="572" width="180" height="90"/><rect x="610" y="572" width="180" height="90"/><rect x="800" y="572" width="180" height="90"/><rect x="990" y="572" width="180" height="90"/>
  </g>
  <g font-family="'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif" font-weight="800" font-size="54" fill="#D69F4C" text-anchor="middle">
    <text x="130" y="444">$200</text><text x="320" y="444">$200</text><text x="510" y="444">$200</text><text x="700" y="444">$200</text><text x="890" y="444">$200</text><text x="1080" y="444">$200</text>
    <text x="130" y="540">$400</text><text x="320" y="540">$400</text><text x="510" y="540">$400</text><text x="700" y="540">$400</text><text x="890" y="540">$400</text><text x="1080" y="540">$400</text>
  </g>
  <rect y="380" width="1200" height="250" fill="url(#fade)"/>
  <!-- the wordmark -->
  <text x="606" y="256" font-family="'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif" font-weight="900" font-size="196" letter-spacing="6" fill="#000000" fill-opacity="0.4" text-anchor="middle">JEOPARODY!</text>
  <text x="600" y="250" font-family="'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif" font-weight="900" font-size="196" letter-spacing="6" fill="#D69F4C" text-anchor="middle">JEOPARODY!</text>
  <text x="600" y="322" font-family="'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif" font-weight="600" font-size="40" letter-spacing="8" fill="#ffffff" fill-opacity="0.88" text-anchor="middle">SIX CATEGORIES. ONE BOARD. PICK YOUR POISON.</text>
</svg>
